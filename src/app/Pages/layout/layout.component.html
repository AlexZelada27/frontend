<div class="layout-container">
  <header class="layout-header">
    <h1>ZoneStyle — Panel de Control</h1>
    <p>Selecciona un módulo para gestionar el estudio y sus reservas.</p>
  </header>

  <section class="grid-modulos">
    <a *ngFor="let mod of modulos" [routerLink]="mod.ruta" class="card-modulo">
      <h3>{{ mod.titulo }}</h3>
      <p>{{ mod.descripcion }}</p>
    </a>
  </section>
</div>
