<div class="modulo-container">
  <div class="modulo-header">
    <div>
      <h2>Zone Style</h2>
      <h2 class="sub-marca">Prod - Music</h2>
    </div>
    <a *ngIf="auth.sesion()" routerLink="/panel" class="link-panel">Ir al Panel →</a>
  </div>

  <div class="tabs-modo">
    <button
      type="button"
      [disabled]="cargando"
      (click)="cambiarModo('login')"
      [class.activo]="modo === 'login'"
    >
      Iniciar Sesión
    </button>

    <button
      type="button"
      [disabled]="cargando"
      (click)="cambiarModo('registro')"
      [class.activo]="modo === 'registro'"
    >
      Registrar Usuario por Rol
    </button>

    <button
      *ngIf="auth.esAdmin()"
      type="button"
      [disabled]="cargando"
      (click)="cambiarModo('gestion')"
      [class.activo]="modo === 'gestion'"
    >
      Administrar Usuarios
    </button>
  </div>

  <p *ngIf="mensaje" class="msg-ok">{{ mensaje }}</p>
  <p *ngIf="error" class="msg-error">{{ error }}</p>

  <!-- VISTA LOGIN -->
  <form *ngIf="modo === 'login'" (ngSubmit)="iniciarSesion()" class="card-login" autocomplete="on">
    <h3>Ingreso al Sistema</h3>
    <div class="campo-vertical">
      <label for="loginCorreo">Correo electrónico</label>
      <input
        id="loginCorreo"
        type="email"
        [(ngModel)]="loginCorreo"
        name="loginCorreo"
        placeholder="ejemplo@zonestyle.com"
        autocomplete="email"
        required
      />
    </div>
    <div class="campo-vertical">
      <label for="loginPassword">Contraseña</label>
      <input
        id="loginPassword"
        type="password"
        [(ngModel)]="loginPassword"
        name="loginPassword"
        placeholder="Tu contraseña"
        autocomplete="current-password"
        required
      />
    </div>
    <div class="acciones-form">
      <button type="submit" class="btn-primario" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
      <button type="button" [disabled]="cargando" (click)="limpiarLogin()">Limpiar</button>
    </div>
  </form>

  <!-- VISTA REGISTRO POR ROL (SIN TABLA EXPUESTA) -->
  <form *ngIf="modo === 'registro'" (ngSubmit)="guardar()" class="form-grid" autocomplete="off">
    <input
      type="text"
      [(ngModel)]="form.nombres"
      name="regNombres"
      placeholder="Nombres"
      autocomplete="off"
      required
    />
    <input
      type="text"
      [(ngModel)]="form.apellidos"
      name="regApellidos"
      placeholder="Apellidos"
      autocomplete="off"
      required
    />
    <input
      type="email"
      [(ngModel)]="form.correo"
      name="regCorreo"
      placeholder="Correo"
      autocomplete="off"
      required
    />
    <input
      type="tel"
      [(ngModel)]="form.telefono"
      name="regTelefono"
      placeholder="Teléfono"
      autocomplete="off"
      required
    />
    <input
      type="password"
      [(ngModel)]="form.password"
      name="regPassword"
      placeholder="Contraseña"
      autocomplete="new-password"
      required
    />

    <select [(ngModel)]="form.idRol" name="regIdRol" required>
      <option [ngValue]="undefined" disabled>Selecciona un rol</option>
      <option *ngFor="let r of rolesActivos" [ngValue]="obtenerIdRolCatalogo(r)">
        {{ r.nombre }}<ng-container *ngIf="r.descripcion"> ({{ r.descripcion }})</ng-container>
      </option>
    </select>

    <input
      type="text"
      [(ngModel)]="form.estado"
      name="regEstado"
      placeholder="Estado (ej. ACTIVO)"
      autocomplete="off"
      required
    />

    <div class="acciones-form">
      <button type="submit" class="btn-primario" [disabled]="cargando">
        {{ cargando ? 'Registrando...' : 'Registrar Usuario' }}
      </button>
      <button type="button" [disabled]="cargando" (click)="limpiar()">Limpiar</button>
    </div>
  </form>

  <!-- VISTA GESTIÓN (SOLO PARA ADMIN AUTENTICADO) -->
  <div *ngIf="modo === 'gestion' && auth.esAdmin()">
    <form (ngSubmit)="guardar()" class="form-grid" autocomplete="off">
      <input
        type="text"
        [(ngModel)]="form.nombres"
        name="admNombres"
        placeholder="Nombres"
        autocomplete="off"
        required
      />
      <input
        type="text"
        [(ngModel)]="form.apellidos"
        name="admApellidos"
        placeholder="Apellidos"
        autocomplete="off"
        required
      />
      <input
        type="email"
        [(ngModel)]="form.correo"
        name="admCorreo"
        placeholder="Correo"
        autocomplete="off"
        required
      />
      <input
        type="tel"
        [(ngModel)]="form.telefono"
        name="admTelefono"
        placeholder="Teléfono"
        autocomplete="off"
        required
      />
      <input
        type="password"
        [(ngModel)]="form.password"
        name="admPassword"
        placeholder="Contraseña (dejar vacía para mantener)"
        autocomplete="new-password"
      />

      <select [(ngModel)]="form.idRol" name="admIdRol" required>
        <option [ngValue]="undefined" disabled>Selecciona un rol</option>
        <option *ngFor="let r of rolesDisponibles" [ngValue]="obtenerIdRolCatalogo(r)">
          {{ r.nombre }}<ng-container *ngIf="r.descripcion"> ({{ r.descripcion }})</ng-container>
        </option>
      </select>

      <input
        type="text"
        [(ngModel)]="form.estado"
        name="admEstado"
        placeholder="Estado (ej. ACTIVO)"
        autocomplete="off"
        required
      />

      <div class="acciones-form">
        <button type="submit" class="btn-primario" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : (editandoId ? 'Actualizar' : 'Crear') }}
        </button>
        <button type="button" *ngIf="editandoId && !cargando" (click)="limpiar()">Cancelar</button>
        <button type="button" *ngIf="!editandoId && !cargando" (click)="limpiar()">Limpiar</button>
      </div>
    </form>

    <table class="tabla-datos" *ngIf="usuarios.length > 0">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios">
          <td>{{ u.nombres }}</td>
          <td>{{ u.apellidos }}</td>
          <td>{{ u.correo }}</td>
          <td>{{ obtenerNombreRol(u) }}</td>
          <td>{{ u.estado }}</td>
          <td class="acciones-tabla">
            <button type="button" [disabled]="cargando" (click)="editar(u)">Editar</button>
            <button
              type="button"
              *ngIf="obtenerIdUsuario(u) !== null"
              [disabled]="cargando"
              (click)="eliminar(obtenerIdUsuario(u)!)"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
