<div class="modulo-container">
  <div class="modulo-header">
    <h2>Gestión de Empleados</h2>
    <a routerLink="/">← Volver al panel</a>
  </div>

  <p *ngIf="mensaje" class="msg-ok">{{ mensaje }}</p>
  <p *ngIf="error" class="msg-error">{{ error }}</p>

  <form (ngSubmit)="guardar()" class="form-fila">
    <input type="text" [(ngModel)]="form.nombre" name="nombre" placeholder="Nombre" required />
    <input type="text" [(ngModel)]="form.cargo" name="cargo" placeholder="Cargo" required />
    <input type="email" [(ngModel)]="form.correo" name="correo" placeholder="Correo" required />
    <button type="submit">{{ editandoId ? 'Actualizar' : 'Registrar' }}</button>
    <button type="button" *ngIf="editandoId" (click)="limpiar()">Cancelar</button>
  </form>

  <table class="tabla-datos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Cargo</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of empleados">
        <td>{{ e.idEmpleado }}</td>
        <td>{{ e.nombre }}</td>
        <td>{{ e.cargo }}</td>
        <td>{{ e.correo }}</td>
        <td class="acciones-tabla">
          <button type="button" (click)="editar(e)">Editar</button>
          <button type="button" *ngIf="e.idEmpleado" (click)="eliminar(e.idEmpleado)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
