<div class="modulo-container">
  <div class="modulo-header">
    <h2>Gestión de Pagos</h2>
    <a routerLink="/">← Volver al panel</a>
  </div>

  <p *ngIf="mensaje" class="msg-ok">{{ mensaje }}</p>
  <p *ngIf="error" class="msg-error">{{ error }}</p>

  <form (ngSubmit)="guardar()" class="form-fila">
    <input type="number" [(ngModel)]="form.monto" name="monto" placeholder="Monto" required min="0" step="0.01" />
    <input type="text" [(ngModel)]="form.metodoPago" name="metodoPago" placeholder="Método de pago (EFECTIVO, YAPE, TARJETA)" required />
    <button type="submit">{{ editandoId ? 'Actualizar' : 'Registrar' }}</button>
    <button type="button" *ngIf="editandoId" (click)="limpiar()">Cancelar</button>
  </form>

  <table class="tabla-datos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Monto</th>
        <th>Método de Pago</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of pagos">
        <td>{{ p.idPago }}</td>
        <td>{{ p.monto }}</td>
        <td>{{ p.metodoPago }}</td>
        <td class="acciones-tabla">
          <button type="button" (click)="editar(p)">Editar</button>
          <button type="button" *ngIf="p.idPago" (click)="eliminar(p.idPago)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
