<div class="modulo-container">
  <div class="modulo-header">
    <h2>Gestión de Roles</h2>
    <a routerLink="/">← Volver al panel</a>
  </div>

  <p *ngIf="mensaje" class="msg-ok">{{ mensaje }}</p>
  <p *ngIf="error" class="msg-error">{{ error }}</p>

  <form (ngSubmit)="guardar()" class="form-fila">
    <input type="text" [(ngModel)]="form.nombre" name="nombre" placeholder="Nombre del rol" required />
    <input type="text" [(ngModel)]="form.descripcion" name="descripcion" placeholder="Descripción" required />
    <label class="check-estado">
      <input type="checkbox" [(ngModel)]="form.estado" name="estado" />
      Activo
    </label>
    <button type="submit">{{ editandoId ? 'Actualizar' : 'Registrar' }}</button>
    <button type="button" *ngIf="editandoId" (click)="limpiar()">Cancelar</button>
  </form>

  <table class="tabla-datos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of roles">
        <td>{{ r.idRol }}</td>
        <td>{{ r.nombre }}</td>
        <td>{{ r.descripcion }}</td>
        <td>{{ r.estado ? 'Activo' : 'Inactivo' }}</td>
        <td class="acciones-tabla">
          <button type="button" (click)="editar(r)">Editar</button>
          <button type="button" *ngIf="r.idRol" (click)="eliminar(r.idRol)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
