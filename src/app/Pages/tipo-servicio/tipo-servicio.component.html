<div class="modulo-container">
  <div class="modulo-header">
    <h2>Gestión de Tipos de Servicio</h2>
    <a routerLink="/">← Volver al panel</a>
  </div>

  <p *ngIf="mensaje" class="msg-ok">{{ mensaje }}</p>
  <p *ngIf="error" class="msg-error">{{ error }}</p>

  <form (ngSubmit)="guardar()" class="form-fila">
    <input type="text" [(ngModel)]="form.nombre" name="nombre" placeholder="Nombre del tipo de servicio" required />
    <button type="submit">{{ editandoId ? 'Actualizar' : 'Registrar' }}</button>
    <button type="button" *ngIf="editandoId" (click)="limpiar()">Cancelar</button>
  </form>

  <table class="tabla-datos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of tipos">
        <td>{{ t.idTipoServicio }}</td>
        <td>{{ t.nombre }}</td>
        <td class="acciones-tabla">
          <button type="button" (click)="editar(t)">Editar</button>
          <button type="button" *ngIf="t.idTipoServicio" (click)="eliminar(t.idTipoServicio)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
